[build]
target = "wasm32-unknown-emscripten"

# Toolchain from `npm run setup` at the repo root (../.work).
[env]
EM_CONFIG = { value = "../.work/emscripten.config", relative = true }
# exnref exception handling throughout: the C side gets these flags, the
# prebuilt std is translated at link. V8 rejects a module mixing the two
# encodings.
EMCC_CFLAGS = "-fwasm-exceptions -sWASM_LEGACY_EXCEPTIONS=0"

[target.wasm32-unknown-emscripten]
linker = "../.work/emsdk/upstream/emscripten/emcc"
rustflags = [
    "-Crelocation-model=static",
    "-Cllvm-args=-wasm-use-legacy-eh=false",
    "-Clink-arg=-sBINARYEN_EXTRA_PASSES=--translate-to-exnref",
    # Tokio's host-driven event loop is unstable.
    "--cfg=tokio_unstable",
    "-Clink-arg=-sENVIRONMENT=node",
    "-Clink-arg=-sNODERAWSOCKETS",
    "-Clink-arg=-sNODE_HOST_ENV",
    "-Clink-arg=-sASSERTIONS=0",
    "-Clink-arg=-sALLOW_MEMORY_GROWTH=1",
    # rustc's target spec passes the deprecated -sWASM_BIGINT.
    "-Clink-arg=-Wno-deprecated",
]
